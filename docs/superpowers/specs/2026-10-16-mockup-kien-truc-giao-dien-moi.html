<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiến trúc giao diện CustomerManager — Mockup</title>
  <link rel="stylesheet" href="./architecture-mockup.css">
  <script defer src="./architecture-mockup-model.js"></script>
  <script defer src="./architecture-mockup-views.js"></script>
  <script defer src="./architecture-mockup-controller.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Đến nội dung</a>
  <header class="preview-controls">
    <strong>CustomerManager <span class="muted">/ Mockup</span></strong>
    <label>Bố cục <select id="layout"><option value="rail">Rail + menu phụ</option><option value="tabs">Tab phân hệ</option></select></label>
    <label>Quyền xem thử <select id="permission"><option value="full">Đầy đủ</option><option value="credit">Chỉ tín dụng</option><option value="dispatch">Chỉ văn thư</option><option value="rates">Chỉ lãi suất</option></select></label>
    <label>Giao diện <select id="theme"><option value="light">Sáng</option><option value="dark">Tối</option></select></label>
    <span class="muted">Dữ liệu mô phỏng · 20/10/2026</span>
  </header>
  <div id="shell" class="shell">
    <nav id="primary" class="primary" aria-label="Phân hệ"></nav>
    <button id="backdrop" class="backdrop" type="button" aria-label="Đóng menu" hidden></button>
    <aside id="drawer" class="drawer" aria-label="Menu phân hệ">
      <div class="drawer-heading"><strong id="drawer-title"></strong><button type="button" data-action="close-menu" class="mobile-only" aria-label="Đóng menu">×</button></div>
      <nav id="secondary" aria-label="Chức năng"></nav>
    </aside>
    <main class="main">
      <header class="app-header">
        <button id="menu-toggle" type="button" data-action="toggle-menu" aria-label="Thu hoặc mở menu" aria-controls="drawer" aria-expanded="true">☰</button>
        <nav id="breadcrumb" class="breadcrumb" aria-label="Vị trí hiện tại"></nav>
        <button type="button" data-action="search" class="search-trigger">Tìm kiếm <kbd>Ctrl K</kbd></button>
      </header>
      <div id="customer-context" class="customer-context" hidden></div>
      <nav id="record-tabs" class="record-tabs" aria-label="Hồ sơ khách hàng" hidden></nav>
      <section id="workspace" class="workspace" tabindex="-1"></section>
    </main>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <form method="dialog" class="dialog-heading"><h2 id="search-title">Tìm kiếm</h2><button aria-label="Đóng tìm kiếm">×</button></form>
    <label for="search-input">Khách hàng, hợp đồng hoặc chức năng</label><input id="search-input" type="search" autocomplete="off">
    <div id="search-results" class="search-results"></div>
  </dialog>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
